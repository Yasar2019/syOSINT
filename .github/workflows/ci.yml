name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository policy
        run: pnpm policy:check
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/collector-api/pyproject.toml
      - name: Install local API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './services/collector-api[test]' pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit --local
      - name: Run API tests
        run: pnpm test:api
      - name: Build local analyst desk
        run: pnpm build:desk
      - name: Build static dashboard
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @syosint/public-dashboard exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Run analyst desk browser workflow
        run: pnpm --filter @syosint/analyst-desk test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/public-dashboard/playwright-report/
            apps/analyst-desk/playwright-report/
            apps/analyst-desk/test-results/
          retention-days: 7
          if-no-files-found: ignore
