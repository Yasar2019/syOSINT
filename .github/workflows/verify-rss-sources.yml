name: Verify public RSS sources

on:
  pull_request:
    paths:
      - config/rss-sources.json
      - services/collector-api/syosint/**
      - .github/workflows/verify-rss-sources.yml

permissions:
  contents: read

jobs:
  verify-live-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/collector-api/pyproject.toml
      - name: Install collector
        run: python -m pip install -e ./services/collector-api
      - name: Check every enabled feed
        run: python -m syosint.rss_gate --config config/rss-sources.json
      - name: Collect fresh Syria headlines
        run: |
          python -m syosint.rss_cli collect-public \
            --config config/rss-sources.json --output /tmp/rss-candidate-wire.json
          python -c 'import json; wire=json.load(open("/tmp/rss-candidate-wire.json", encoding="utf-8")); assert any(entry["sourceId"] in {"sana-english", "sana-arabic", "north-press-english", "north-press-arabic", "enab-baladi-arabic"} for entry in wire["entries"]), "no fresh Syria headlines from candidate feeds"'
