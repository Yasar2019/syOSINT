name: Refresh RSS News Wire

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable Corepack
        run: corepack enable
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/collector-api/pyproject.toml
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './services/collector-api'
       - name: Collect allowlisted public feeds
         run: >-
           pnpm collect:rss:public --previous-url
           https://yasar2019.github.io/syOSINT/news-wire.v1.json
      - name: Validate with validatePublicNewsWire contract
        run: |
          node apps/public-dashboard/scripts/sync-public-data.mjs
          pnpm --filter @syosint/schemas test
      - name: Run dashboard and repository tests
        run: pnpm test
      - name: Build repository-scoped export
        env:
          GITHUB_ACTIONS: "true"
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/public-dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
