[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "syosint-collector-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.137.2", "starlette==1.3.1", "uvicorn==0.34.3", "SQLAlchemy==2.0.41", "alembic==1.16.2", "jsonschema==4.24.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
